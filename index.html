<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planos</title>
<meta name="description" content="Aprende system design paso a paso: lecciones cortas y los 55 problemas de systemdesign.io guiados.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1A2D" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one reading column (720px) on drafting paper. Home = today's session, things to review, the route by modules.
   A unit is a reading page: lessons flow top to bottom; problems are a vertical stepper you reveal step by step. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface-2: #F6F8FB; --ink: #18202F; --muted: #596377; --faint: #8F97A8;
  --line: #DAE0E9; --grid: rgba(37, 84, 200, .055); --plan-bg: #F7F9FD; --blue-line: #9DB3E6;
  --blue: #2554C8; --blue-deep: #193C95; --blue-soft: #E5ECFC; --on-blue: #FFFFFF;
  --pencil: #D9502B; --pencil-soft: #FCEBE4;
  --green: #1D8A57; --green-soft: #E2F2E9;
  --amber: #A86A12; --amber-soft: #FAF0DC;
  --shadow: 0 1px 2px rgba(24, 32, 47, .05), 0 8px 24px rgba(24, 32, 47, .05);
  --heat-1: #DCE5FA; --heat-2: #95B0EE; --heat-3: #4268D2; --heat-4: #193C95; --heat-ink-3: #FFFFFF; --heat-ink-4: #FFFFFF;
  --sc-b-t: #DFE8FC; --sc-b-l: #B7CBF3; --sc-b-r: #8FAAE6; --sc-b-i: #1D3F94;
  --sc-t-t: #D6F1EC; --sc-t-l: #A6DCD3; --sc-t-r: #78C2B6; --sc-t-i: #135F55;
  --sc-a-t: #FCEDCB; --sc-a-l: #F3D48D; --sc-a-r: #E3B75A; --sc-a-i: #774B05;
  --sc-p-t: #ECE3FB; --sc-p-l: #D2C1F2; --sc-p-r: #B79FE6; --sc-p-i: #4C2D94;
  --sc-g-t: #DFF2E6; --sc-g-l: #B3DFC2; --sc-g-r: #88C99D; --sc-g-i: #1C6A3C;
  --sc-n-t: #F4F2EE; --sc-n-l: #E1DCD2; --sc-n-r: #CBC4B6; --sc-n-i: #3A4150;
  --sc-hot-t: #FBDCD1; --sc-hot-l: #F4B39E; --sc-hot-r: #E98B70; --sc-hot-i: #8C280C;
  --sc-down-t: #ECEEF2; --sc-down-l: #D8DBE1; --sc-down-r: #C2C7CF; --sc-down-i: #8A90A0;
  --pk-req: #E0662F; --pk-resp: #1D8A57; --pk-write: #2554C8; --pk-event: #7C4DDB; --pk-heavy: #B93A0C; --pk-fail: #D92D20;
  --ppl-0: #F2A65A; --ppl-1: #7FA7E8; --ppl-2: #8DC37A; --ppl-3: #B9A3E8;
  --f-display: "Archivo", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1A2D; --surface: #112239; --surface-2: #152A45; --ink: #E4ECF7; --muted: #9EB0C9; --faint: #6D819D;
    --line: #22395A; --grid: rgba(140, 180, 255, .075); --plan-bg: #0E2036; --blue-line: #3F64A3;
    --blue: #86A9FF; --blue-deep: #4F73CC; --blue-soft: #1A3258; --on-blue: #0A1628;
    --pencil: #FF8C66; --pencil-soft: #3A2019;
    --green: #50C48D; --green-soft: #113021;
    --amber: #E8B451; --amber-soft: #382A10;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .2);
    --heat-1: #234476; --heat-2: #2E5698; --heat-3: #5E86DA; --heat-4: #9DB9FF; --heat-ink-3: #0A1628; --heat-ink-4: #0A1628;
    --sc-b-t: #2E4F8F; --sc-b-l: #243F73; --sc-b-r: #1B3159; --sc-b-i: #CFE0FF;
    --sc-t-t: #1F5C56; --sc-t-l: #184A45; --sc-t-r: #123A36; --sc-t-i: #BDEDE6;
    --sc-a-t: #6B5220; --sc-a-l: #574219; --sc-a-r: #433313; --sc-a-i: #FCE6B5;
    --sc-p-t: #4B3A80; --sc-p-l: #3D2F69; --sc-p-r: #2F2452; --sc-p-i: #E3D7FF;
    --sc-g-t: #245C3C; --sc-g-l: #1D4B31; --sc-g-r: #163A26; --sc-g-i: #C9F0D8;
    --sc-n-t: #2A3A52; --sc-n-l: #223047; --sc-n-r: #1A263A; --sc-n-i: #DCE5F2;
    --sc-hot-t: #7A3020; --sc-hot-l: #64271A; --sc-hot-r: #4E1F14; --sc-hot-i: #FFD3C4;
    --sc-down-t: #2A3340; --sc-down-l: #222A35; --sc-down-r: #1B222B; --sc-down-i: #7E8796;
    --pk-req: #FF8C66; --pk-resp: #50C48D; --pk-write: #86A9FF; --pk-event: #B794FF; --pk-heavy: #FF7A45; --pk-fail: #FF6B5E;
    --ppl-0: #F2A65A; --ppl-1: #86A9FF; --ppl-2: #7CC873; --ppl-3: #B794FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1A2D; --surface: #112239; --surface-2: #152A45; --ink: #E4ECF7; --muted: #9EB0C9; --faint: #6D819D;
  --line: #22395A; --grid: rgba(140, 180, 255, .075); --plan-bg: #0E2036; --blue-line: #3F64A3;
  --blue: #86A9FF; --blue-deep: #4F73CC; --blue-soft: #1A3258; --on-blue: #0A1628;
  --pencil: #FF8C66; --pencil-soft: #3A2019;
  --green: #50C48D; --green-soft: #113021;
  --amber: #E8B451; --amber-soft: #382A10;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .2);
  --heat-1: #234476; --heat-2: #2E5698; --heat-3: #5E86DA; --heat-4: #9DB9FF; --heat-ink-3: #0A1628; --heat-ink-4: #0A1628;
  --sc-b-t: #2E4F8F; --sc-b-l: #243F73; --sc-b-r: #1B3159; --sc-b-i: #CFE0FF;
  --sc-t-t: #1F5C56; --sc-t-l: #184A45; --sc-t-r: #123A36; --sc-t-i: #BDEDE6;
  --sc-a-t: #6B5220; --sc-a-l: #574219; --sc-a-r: #433313; --sc-a-i: #FCE6B5;
  --sc-p-t: #4B3A80; --sc-p-l: #3D2F69; --sc-p-r: #2F2452; --sc-p-i: #E3D7FF;
  --sc-g-t: #245C3C; --sc-g-l: #1D4B31; --sc-g-r: #163A26; --sc-g-i: #C9F0D8;
  --sc-n-t: #2A3A52; --sc-n-l: #223047; --sc-n-r: #1A263A; --sc-n-i: #DCE5F2;
  --sc-hot-t: #7A3020; --sc-hot-l: #64271A; --sc-hot-r: #4E1F14; --sc-hot-i: #FFD3C4;
  --sc-down-t: #2A3340; --sc-down-l: #222A35; --sc-down-r: #1B222B; --sc-down-i: #7E8796;
  --pk-req: #FF8C66; --pk-resp: #50C48D; --pk-write: #86A9FF; --pk-event: #B794FF; --pk-heavy: #FF7A45; --pk-fail: #FF6B5E;
  --ppl-0: #F2A65A; --ppl-1: #86A9FF; --ppl-2: #7CC873; --ppl-3: #B794FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 16px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 64px;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 105%; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; }
pre.code { background: var(--plan-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font: 400 .84rem/1.6 var(--f-mono); margin: 0; }
pre.code code { background: none; border: 0; padding: 0; font-size: inherit; }
.prose { display: flex; flex-direction: column; gap: .75em; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: .3em; }
.prose strong { font-weight: 600; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 600 .74rem/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.muted { color: var(--muted); }
.mono-label { font: 500 .7rem/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font: 800 1.35rem/1 var(--f-display); font-stretch: 112%; letter-spacing: .01em; }
.brand span { display: block; font: 500 .68rem/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .85rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 16px; height: 16px; color: var(--blue); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 1.15rem; }

/* Today */
.today h2 { font-size: 1.6rem; font-weight: 800; }
.today .sub { color: var(--muted); margin-top: 4px; }
.plan-list { list-style: none; margin: 16px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.plan-item { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); text-align: left; width: 100%; cursor: pointer; }
.plan-item:hover:not(:disabled) { border-color: var(--blue-line); }
.plan-item:disabled { cursor: default; }
.plan-item .num { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 600 .78rem/1 var(--f-mono); border: 1.5px solid var(--blue-line); color: var(--blue); background: var(--surface); }
.plan-item.done .num { background: var(--green); border-color: var(--green); color: var(--surface); }
.plan-item.done .num svg { width: 18px; height: 18px; }
.plan-item .t { min-width: 0; }
.plan-item .t b { display: block; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.plan-item .t small { color: var(--muted); font-size: .85rem; }
.plan-item .mins { font: 500 .8rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.kind { font: 600 .66rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; }
.kind.lesson { color: var(--blue); }
.kind.problem { color: var(--pencil); }
.done-note { display: flex; gap: 10px; align-items: flex-start; background: var(--green-soft); border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.done-note svg { width: 22px; height: 22px; color: var(--green); flex: none; margin-top: 1px; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 .98rem/1 var(--f-body); border: 0; border-radius: 12px; padding: 13px 20px; cursor: pointer; background: var(--blue); color: var(--on-blue); box-shadow: 0 3px 0 var(--blue-deep); transition: transform .08s ease, box-shadow .08s ease; text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.alt:active:not(:disabled) { box-shadow: 0 1px 0 var(--line); }
.btn.small { padding: 9px 14px; font-size: .9rem; }
.link { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; text-align: left; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-weight: 500; cursor: pointer; padding: 6px 0; }
.back svg { width: 18px; height: 18px; }

/* Review list */
.rev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rev-list button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.rev-list .tag { font: 600 .7rem/1 var(--f-mono); padding: 4px 7px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }

/* Route */
.module { border-top: 1px solid var(--line); }
.module:first-of-type { border-top: 0; }
.module summary { display: grid; grid-template-columns: auto 1fr 76px auto; align-items: center; gap: 12px; padding: 13px 0; cursor: pointer; list-style: none; }
.module summary::-webkit-details-marker { display: none; }
.module .mnum { font: 600 .74rem/1 var(--f-mono); color: var(--blue); border: 1.5px solid var(--blue-line); border-radius: 7px; padding: 5px 7px; }
.module .mtitle { font-weight: 600; min-width: 0; }
.module .mtitle small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--green); }
.count { font: 500 .8rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.units { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; }
.unit-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 8px 4px; border-radius: 8px; cursor: pointer; }
.unit-row:hover:not(:disabled) { background: var(--surface-2); }
.unit-row:disabled { cursor: default; color: var(--faint); }
.unit-row .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.unit-row .dot svg { width: 12px; height: 12px; }
.unit-row.done .dot { background: var(--green); border-color: var(--green); color: var(--surface); }
.unit-row.next .dot { border-color: var(--blue); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 10px var(--blue); }
.unit-row .ut { min-width: 0; line-height: 1.35; }
.unit-row .ut .kind { margin-right: 6px; }
.unit-row .ur { font: 500 .78rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.soon { font: 500 .72rem var(--f-mono); color: var(--faint); }

/* Unit page */
.unit-head { display: flex; flex-direction: column; gap: 10px; }
.unit-tag { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font: 600 .68rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.badge.lesson { color: var(--blue); border-color: var(--blue-line); }
.badge.problem { color: var(--pencil); border-color: color-mix(in srgb, var(--pencil) 45%, transparent); }
.unit-head h1 { font-size: clamp(1.7rem, 5.6vw, 2.35rem); line-height: 1.08; font-weight: 800; }
.unit-head .orig { color: var(--muted); font-size: .95rem; }
.lead { font-size: 1.12rem; line-height: 1.55; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 1.3rem; }
.callout { display: flex; flex-direction: column; gap: 4px; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface-2); }
.callout .mono-label { color: inherit; }
.callout.tip { background: var(--green-soft); border-color: transparent; }
.callout.tip .mono-label { color: var(--green); }
.callout.trap { background: var(--pencil-soft); border-color: transparent; }
.callout.trap .mono-label { color: var(--pencil); }
.callout.interview { background: var(--blue-soft); border-color: transparent; }
.callout.interview .mono-label { color: var(--blue); }
.callout.example .mono-label { color: var(--muted); }
.gloss { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 8px 16px; margin: 0; }
.gloss dt { font: 600 .88rem/1.45 var(--f-mono); color: var(--blue); }
.gloss dd { margin: 0; }
.checks { display: flex; flex-direction: column; gap: 18px; }
.check { display: flex; flex-direction: column; gap: 8px; }
.check .q { font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--blue-line); }
.opt .k { flex: none; font: 600 .78rem/1.6 var(--f-mono); color: var(--muted); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--pencil); background: var(--pencil-soft); }
.opt:disabled { cursor: default; }
.explain { font-size: .95rem; padding-left: 12px; border-left: 2px solid var(--blue-line); }
.ideas { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.prereqs { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; cursor: pointer; }
.chip svg { width: 14px; height: 14px; }
.chip.ok { border-color: color-mix(in srgb, var(--green) 50%, transparent); color: var(--green); }
.story { border: 1.5px dashed var(--blue-line); border-radius: 12px; padding: 14px 16px; background: var(--plan-bg); }

/* Problem steps */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 14px; position: relative; padding-bottom: 18px; }
.step::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .sn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 .82rem/1 var(--f-mono); border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); position: relative; z-index: 1; }
.step.current .sn { border-color: var(--blue); color: var(--blue); }
.step.seen .sn { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.step .sh { display: flex; align-items: center; min-height: 34px; }
.step .sh h3 { font-size: 1.08rem; }
.step .sh button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.step.future .sh h3 { color: var(--faint); font-weight: 600; }
.step .sb { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.prose, .section, .reveal, .think, .card, .qa { min-width: 0; }
.think { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.think .mono-label { color: var(--blue); }
textarea.notes { width: 100%; min-height: 80px; resize: vertical; font: 400 .95rem/1.5 var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea.notes:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.hint { font-size: .95rem; background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; }
.hint b { color: var(--amber); font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
.reveal { display: flex; flex-direction: column; gap: 12px; }
.qa { border-top: 1px solid var(--line); }
.qa:first-child { border-top: 0; }
.qa summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: grid; grid-template-columns: 1fr 14px; gap: 12px; align-items: center; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary svg { width: 14px; height: 14px; color: var(--faint); transition: transform .2s; }
.qa[open] summary svg { transform: rotate(90deg); }
.qa .prose { padding-bottom: 14px; }
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.res a { font-weight: 600; }
.res small { color: var(--muted); }

/* Diagram (plano) */
.plan { margin: 0; border: 1.5px solid var(--blue-line); border-radius: 12px; background-color: var(--plan-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; padding: 12px 14px 16px; }
.plan-head { display: flex; justify-content: space-between; gap: 10px; font: 600 .66rem/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); border-bottom: 1px dashed var(--blue-line); padding-bottom: 8px; margin-bottom: 14px; }
.plan-head span:last-child { text-align: right; }
.layer { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.layer-label { font: 500 .64rem/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.nodes { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.node { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 8px 12px; background: var(--surface); border: 1.5px solid var(--blue-line); border-radius: 8px; }
.node .ico { width: 20px; height: 20px; flex: none; color: var(--blue); }
.node .nl { font: 600 .86rem/1.25 var(--f-body); }
.node .nn { display: block; font: 400 .72rem/1.3 var(--f-mono); color: var(--muted); }
.k-cache .ico { color: var(--amber); }
.k-queue .ico, .k-stream .ico { color: var(--pencil); }
.k-worker .ico { color: var(--green); }
.k-client .ico, .k-external .ico { color: var(--muted); }
.arrow { width: 2px; height: 22px; background: var(--blue-line); margin: 6px auto; position: relative; }
.arrow::after { content: ""; position: absolute; left: -4px; bottom: -2px; border: 5px solid transparent; border-top: 7px solid var(--blue-line); border-bottom: 0; }
.flow { margin: 14px 0 0; padding: 12px 0 0 1.5em; border-top: 1px dashed var(--blue-line); font-size: .92rem; display: flex; flex-direction: column; gap: 4px; }

/* Finish + ask */
.feel { display: flex; flex-direction: column; gap: 12px; }
.feel-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.feel-btns button { padding: 12px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .92rem; line-height: 1.3; }
.feel-btns button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.next-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--green-soft); }
.ask { display: flex; flex-direction: column; gap: 10px; }
.ask textarea { width: 100%; min-height: 76px; resize: vertical; font: 400 .95rem/1.5 var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ask textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.ask .btn { align-self: flex-start; }
.ask-out { border-top: 1px solid var(--line); padding-top: 12px; }
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 16px; }
.sk { background: var(--surface-2); border-radius: 8px; height: 14px; animation: pulse 1.4s ease-in-out infinite; }
.sk.h { height: 30px; width: 70%; }
@keyframes pulse { 50% { opacity: .45; } }

@media (max-width: 480px) {
  .card { padding: 16px; }
  .module summary { grid-template-columns: auto 1fr auto; }
  .module summary .meter { display: none; }
  .gloss { grid-template-columns: 1fr; gap: 2px; }
  .gloss dd { margin-bottom: 8px; }
  .feel-btns button { font-size: .85rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Installed app: clear the status bar and the home indicator. */
body {
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}

/* Install and notification cards */
.setup { display: flex; flex-direction: column; gap: 12px; }
.setup h2 { font-size: 1.15rem; }
.steps-ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.steps-ol li::marker { font: 600 .85rem var(--f-mono); color: var(--blue); }
.share-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--blue); }
.status-line { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.status-line svg { width: 20px; height: 20px; flex: none; }
.status-line.ok { color: var(--green); }
.status-line.warn { color: var(--amber); }
.code-box { font: 400 .72rem/1.45 var(--f-mono); background: var(--plan-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 120px; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; user-select: all; -webkit-user-select: all; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .92rem; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Settings */
.settings { display: flex; flex-direction: column; gap: 16px; }
.settings .row { display: flex; flex-direction: column; gap: 8px; }
.settings .row + .row { border-top: 1px solid var(--line); padding-top: 16px; }
.settings h3 { font-size: 1rem; }
.settings textarea { width: 100%; min-height: 80px; resize: vertical; font: 400 .8rem/1.4 var(--f-mono); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.foot { text-align: center; color: var(--faint); font: 400 .75rem var(--f-mono); }

/* Search entry points */
.pill-btn { cursor: pointer; color: var(--ink); }
.pill-btn:hover { border-color: var(--blue-line); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.small-link { font-size: .85rem; font-weight: 500; }

/* Listening */
.tts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.tts .btn svg { width: 16px; height: 16px; }
.tts-pos { font: 500 .78rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Review */
.rev-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; }
.rev-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); }
.rev-ico svg { width: 22px; height: 22px; }
.rev-txt { min-width: 0; }
.rev-txt h2 { font-size: 1.15rem; }
.rev-meter { height: 6px; }
.rev-meter > span { background: var(--blue); }
.flash { display: flex; flex-direction: column; gap: 14px; }
.flash-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.flash-meta .mono-label { color: var(--blue); }
.flash-term { font: 800 1.7rem/1.15 var(--f-display); font-stretch: 105%; overflow-wrap: anywhere; }
.flash-q { font-weight: 600; font-size: 1.08rem; line-height: 1.45; }
.flash-body { display: flex; flex-direction: column; gap: 10px; }
.flash-back { border-top: 1px dashed var(--blue-line); padding-top: 14px; }

.grade-btns button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 11px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }

.grade-btns .g-again { border-color: color-mix(in srgb, var(--pencil) 45%, var(--line)); color: var(--pencil); }
.grade-btns .g-good { border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); color: var(--blue); }
.grade-btns .g-easy { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); color: var(--green); }
.rev-end { display: flex; flex-direction: column; gap: 12px; }
.rev-end h1 { font-size: 1.8rem; }

/* Search */
.search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px 14px; box-shadow: var(--shadow); }
.search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.search-box svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search-box input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: 500 1.05rem/1.4 var(--f-body); padding: 10px 0; }
#search-results { display: flex; flex-direction: column; gap: 18px; }
.gloss-all dd { padding-bottom: 6px; }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hits button { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; cursor: pointer; }
.hits li:first-child button { border-top: 0; }
.hits b { font-weight: 600; }
.snip { color: var(--muted); font-size: .9rem; line-height: 1.45; }
mark { background: color-mix(in srgb, var(--amber) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* Progress: streak, week, calendar, totals, achievements */
.flame-ico { display: inline-flex; }
.pill .flame-ico svg { color: var(--pencil); }
.streak-card-home { display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
.streak-card-home:hover { border-color: var(--blue-line); }
.streak-home { display: block; width: 100%; text-align: left; cursor: pointer; color: var(--ink); background: none; border: 0; padding: 0; }
.st-row { display: grid; grid-template-columns: 44px 1fr 20px; align-items: center; gap: 14px; }
.st-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--pencil-soft); color: var(--pencil); }
.st-ico svg { width: 24px; height: 24px; }
.st-ico.off { background: var(--surface-2); color: var(--faint); }
.st-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.st-txt b { font: 700 1.15rem/1.2 var(--f-display); font-stretch: 105%; }
.st-txt .muted { font-size: .9rem; line-height: 1.4; }
.st-chev svg { width: 18px; height: 18px; color: var(--faint); }
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk-day { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wk-l { font: 600 .7rem/1 var(--f-mono); color: var(--muted); }
.wk-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1.5px solid var(--line); }
.wk-dot svg { width: 16px; height: 16px; }
.wk-day.on .wk-dot { background: var(--green); border-color: var(--green); color: var(--surface); }
.wk-day.rest .wk-dot { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.wk-day.today .wk-dot { border: 2px solid var(--ink); }
.wk-day.today .wk-l { color: var(--ink); }
.wk-day.future { opacity: .45; }
.streak-card { display: flex; flex-direction: column; gap: 16px; }
.sc-main { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sc-flame { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--pencil-soft); color: var(--pencil); flex: none; }
.sc-flame svg { width: 36px; height: 36px; }
.sc-flame.off { background: var(--surface-2); color: var(--faint); }
.sc-num { font: 800 2.6rem/1 var(--f-display); font-stretch: 110%; font-variant-numeric: tabular-nums; }
.sc-lbl { color: var(--muted); font-weight: 500; }
.sc-side { margin: 0 0 0 auto; display: flex; gap: 18px; }
.sc-side div { display: flex; flex-direction: column; }
.sc-side dt { font: 500 .68rem/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sc-side dd { margin: 2px 0 0; font: 700 1.1rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.rest-box { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rest-box b { display: block; }
.rest-box .muted { font-size: .9rem; line-height: 1.45; }
.rest-slots { display: flex; gap: 6px; padding-top: 2px; }
.rest-slot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--line); color: var(--faint); }
.rest-slot svg { width: 15px; height: 15px; }
.rest-slot.full { border: 1.5px solid var(--blue-line); background: var(--blue-soft); color: var(--blue); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.cal-nav h2 { font-size: 1.15rem; }
.cal-nav .icon-btn:disabled { opacity: .35; cursor: default; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-head span { text-align: center; font: 600 .7rem/1 var(--f-mono); color: var(--muted); padding-bottom: 6px; }
.cal-cell { position: relative; aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 500 .82rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); cursor: pointer; padding: 0; min-width: 0; }
.cal-cell.lv-1 { background: var(--heat-1); border-color: transparent; }
.cal-cell.lv-2 { background: var(--heat-2); border-color: transparent; }
.cal-cell.lv-3 { background: var(--heat-3); border-color: transparent; color: var(--heat-ink-3); }
.cal-cell.lv-4 { background: var(--heat-4); border-color: transparent; color: var(--heat-ink-4); }
.cal-cell.today { font-weight: 700; }
.cal-cell.today::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 4px; height: 2px; border-radius: 2px; background: currentColor; }
.cal-cell[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.cal-cell:disabled { opacity: .35; cursor: default; background: transparent; }
.cal-cell .cal-rest { position: absolute; top: 3px; right: 3px; width: 11px; height: 11px; color: var(--blue); }
.cal-cell .cal-rest svg { width: 11px; height: 11px; display: block; }
.cal-legend { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-top: 12px; font-size: .8rem; color: var(--muted); }
.cal-legend .ramp { display: inline-flex; align-items: center; gap: 4px; }
.cal-legend .sw { width: 13px; height: 13px; border-radius: 4px; display: inline-block; background: var(--surface-2); border: 1px solid var(--line); }
.cal-legend .sw.lv-1 { background: var(--heat-1); border-color: transparent; }
.cal-legend .sw.lv-2 { background: var(--heat-2); border-color: transparent; }
.cal-legend .sw.lv-3 { background: var(--heat-3); border-color: transparent; }
.cal-legend .sw.lv-4 { background: var(--heat-4); border-color: transparent; }
.cal-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.cal-legend .lg svg { width: 13px; height: 13px; color: var(--blue); }
.cal-detail { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.cal-detail h3 { font-size: 1rem; }
.day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.day-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.day-list button b { font-weight: 600; line-height: 1.35; }
.day-rev { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .92rem; padding: 2px 2px; }
.day-rev svg { width: 18px; height: 18px; color: var(--blue); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .big { font: 800 1.5rem/1.1 var(--f-display); font-stretch: 105%; font-variant-numeric: tabular-nums; }
.tile .muted { font-size: .84rem; line-height: 1.4; }
.tile .meter { margin-top: 4px; }
.bdg-group + .bdg-group { margin-top: 16px; }
.bdg-group h3 { font: 500 .7rem/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.bdg-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bdg { display: grid; grid-template-columns: 38px 1fr; gap: 4px 10px; align-items: center; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.bdg-ico { grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line); color: var(--faint); font: 700 .78rem/1 var(--f-mono); }
.bdg-ico svg { width: 19px; height: 19px; }
.bdg b { font-weight: 600; font-size: .92rem; line-height: 1.25; overflow-wrap: anywhere; }
.bdg .muted { font-size: .78rem; line-height: 1.3; }
.bdg .meter { grid-column: 2; height: 5px; }
.bdg .meter > span { background: var(--blue); }
.bdg.on { border-style: solid; background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
.bdg.on .bdg-ico { background: var(--amber); border-color: var(--amber); color: var(--surface); }
.celebrate { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--pencil-soft); border: 1px solid color-mix(in srgb, var(--pencil) 30%, transparent); animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.cel-row { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
.cel-row b { display: block; line-height: 1.3; }
.cel-row span:not(.cel-ico) { display: block; color: var(--muted); font-size: .9rem; line-height: 1.4; }
.cel-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--pencil); }
.cel-ico svg { width: 20px; height: 20px; }
.cel-ico.medal { background: var(--amber); color: var(--surface); }
.celebrate .small-link { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.celebrate .small-link svg { width: 14px; height: 14px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 480px) {
  .sc-side { margin-left: 0; width: 100%; }
  .tile .big { font-size: 1.3rem; }
  .bdg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bdg { grid-template-columns: 1fr; padding: 10px; }
  .bdg-ico { grid-row: auto; width: 34px; height: 34px; }
  .bdg .meter { grid-column: 1; }
  .cal-cell { font-size: .76rem; border-radius: 7px; }
}

/* Scenes: «Míralo en acción». The stage is a blueprint: blocks on drafting paper, packets moving along the links. */
.scene-card { position: relative; display: flex; flex-direction: column; gap: 12px; overflow: clip; }
.sc-metrics, .sc-steps, .mt { position: relative; }
.sc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sc-head .mono-label { color: var(--blue); }
.chap { font: 600 .66rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.chap-problem { color: var(--pencil); background: var(--pencil-soft); }
.chap-technique { color: var(--blue); background: var(--blue-soft); }
.chap-solution { color: var(--green); background: var(--green-soft); }
.chap-case { color: var(--amber); background: var(--amber-soft); }
.chap-recap { color: var(--muted); background: var(--surface-2); }
.sc-title { font-size: 1.35rem; line-height: 1.2; font-weight: 800; }
.sc-metrics { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px 2px; }
.sc-metrics::-webkit-scrollbar { display: none; }
.mt { flex: none; min-width: 96px; max-width: 150px; display: flex; flex-direction: column; gap: 3px; padding: 8px 11px; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; background: var(--surface-2); }

.mt .mv { display: inline-flex; align-items: center; gap: 4px; font: 700 1.02rem/1.15 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mt .dl { display: inline-flex; }
.mt .dl svg { width: 13px; height: 13px; }

.mt.bad .dl { color: var(--pk-fail); }
.sc-stage { position: relative; margin: 0 -20px; padding: 8px 6px; background-color: var(--plan-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; border-block: 1px solid var(--line); touch-action: pan-y; }
.scene-svg { display: block; width: 100%; height: auto; max-height: 64vh; margin: 0 auto; overflow: visible; }
.sc-ctrl { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 9px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.sc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); }
.lg-i { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg-req { background: var(--pk-req); }
.lg-resp { background: var(--pk-resp); }
.lg-write { background: var(--pk-write); border-radius: 2px; }
.lg-event { background: var(--pk-event); transform: rotate(45deg); border-radius: 1px; }

.lg-ping { border: 2px solid var(--pk-write); }

.sc-panel { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.sc-panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font: 500 .84rem/1.45 var(--f-mono); }
.sc-panel li { padding: 3px 8px; border-radius: 6px; }
.sc-panel li.t-good { background: var(--green-soft); color: var(--green); }
.sc-panel li.t-bad { background: var(--pencil-soft); color: var(--pencil); }
.sc-steps { list-style: none; margin: 0 -20px; padding: 4px 20px 6px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }

.sc-steps .d { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 .76rem/1 var(--f-mono); border: 1.5px solid var(--line); background: var(--surface); }
.sc-steps .s { font-size: .7rem; line-height: 1.2; text-align: center; max-width: 66px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sc-steps .past .d { border-color: var(--blue-line); color: var(--blue); background: var(--blue-soft); }

.sc-call { border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); }
.sc-call.c-insight { background: var(--blue-soft); border-color: var(--blue-line); }
.sc-call.c-tip { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.sc-call.c-warn { background: var(--pencil-soft); border-color: color-mix(in srgb, var(--pencil) 35%, transparent); }
.sc-changes ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.sc-changes li { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; line-height: 1.3; padding: 4px 9px 4px 5px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.sc-changes li code { font-size: .78rem; }
.sc-changes .sg { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 700 .78rem/1 var(--f-mono); flex: none; }
.ch-add .sg { background: var(--green-soft); color: var(--green); }

.sc-nav { display: flex; justify-content: space-between; gap: 10px; }
.sc-nav .btn { white-space: nowrap; flex: none; }
.sc-nav .grow { flex: 0 1 auto; min-width: 0; }
.sc-nav .grow .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sc-nav .btn svg { width: 16px; height: 16px; }
.sc-nav .btn:disabled { opacity: .45; cursor: default; }
.sc-goals { border-top: 1px dashed var(--line); padding-top: 10px; }
.sc-goals ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.sc-goals li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: center; }
.sc-goals .gk { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--surface); }
.sc-goals .gk svg { width: 13px; height: 13px; }
.sc-goals li.ok .gk { background: var(--green); border-color: var(--green); }
.sc-goals .link { font-weight: 500; color: var(--muted); font-size: .9rem; padding: 2px 0; }
.sc-goals li.ok .link { color: var(--ink); }

/* The drawing itself */
.scene-svg text { font-family: var(--f-body); }
.scene-svg .f-t, .scene-svg .f-l, .scene-svg .f-r { stroke-width: 1.4; stroke-linejoin: round; }
.sc-node.h-b .f-t { fill: var(--sc-b-t); } .sc-node.h-b .f-l { fill: var(--sc-b-l); } .sc-node.h-b .f-r { fill: var(--sc-b-r); } .sc-node.h-b .body { stroke: var(--sc-b-i); color: var(--sc-b-i); }
.sc-node.h-t .f-t { fill: var(--sc-t-t); } .sc-node.h-t .f-l { fill: var(--sc-t-l); } .sc-node.h-t .f-r { fill: var(--sc-t-r); } .sc-node.h-t .body { stroke: var(--sc-t-i); color: var(--sc-t-i); }
.sc-node.h-a .f-t { fill: var(--sc-a-t); } .sc-node.h-a .f-l { fill: var(--sc-a-l); } .sc-node.h-a .f-r { fill: var(--sc-a-r); } .sc-node.h-a .body { stroke: var(--sc-a-i); color: var(--sc-a-i); }
.sc-node.h-p .f-t { fill: var(--sc-p-t); } .sc-node.h-p .f-l { fill: var(--sc-p-l); } .sc-node.h-p .f-r { fill: var(--sc-p-r); } .sc-node.h-p .body { stroke: var(--sc-p-i); color: var(--sc-p-i); }
.sc-node.h-g .f-t { fill: var(--sc-g-t); } .sc-node.h-g .f-l { fill: var(--sc-g-l); } .sc-node.h-g .f-r { fill: var(--sc-g-r); } .sc-node.h-g .body { stroke: var(--sc-g-i); color: var(--sc-g-i); }
.sc-node.h-n .f-t { fill: var(--sc-n-t); } .sc-node.h-n .f-l { fill: var(--sc-n-l); } .sc-node.h-n .f-r { fill: var(--sc-n-r); } .sc-node.h-n .body { stroke: var(--sc-n-i); color: var(--sc-n-i); }
.sc-node.s-hot .f-t { fill: var(--sc-hot-t); } .sc-node.s-hot .f-l { fill: var(--sc-hot-l); } .sc-node.s-hot .f-r { fill: var(--sc-hot-r); } .sc-node.s-hot .body { stroke: var(--sc-hot-i); color: var(--sc-hot-i); }
.sc-node.s-down .f-t { fill: var(--sc-down-t); } .sc-node.s-down .f-l { fill: var(--sc-down-l); } .sc-node.s-down .f-r { fill: var(--sc-down-r); } .sc-node.s-down .body { stroke: var(--sc-down-i); color: var(--sc-down-i); stroke-dasharray: 4 3; }
.sc-node.s-down .label text { text-decoration: line-through; fill: var(--muted); }
.sc-node.s-dim { opacity: .32; }
.sc-node .n-ico { stroke: currentColor; }
.sc-node .screen { fill: var(--sc-n-i); stroke: var(--sc-n-i); }
.sc-node .screen-in { fill: var(--blue-soft); stroke: none; }
.person rect, .person circle { stroke: var(--ink); stroke-width: 1; }
.person.p0 rect, .person.p0 circle, .tick.p0 { fill: var(--ppl-0); }
.person.p1 rect, .person.p1 circle, .tick.p1 { fill: var(--ppl-1); }
.person.p2 rect, .person.p2 circle, .tick.p2 { fill: var(--ppl-2); }
.person.p3 rect, .person.p3 circle, .tick.p3 { fill: var(--ppl-3); }
.sc-node .glow { fill: var(--pk-fail); opacity: .16; animation: sc-pulse 1.6s ease-in-out infinite; }
.sc-node .halo { stroke-width: 2; }
.sc-node .halo-good { fill: color-mix(in srgb, var(--green) 14%, transparent); stroke: var(--green); }
.sc-node .halo-bad { fill: color-mix(in srgb, var(--pk-fail) 12%, transparent); stroke: var(--pk-fail); }
.sc-node .down-x path { stroke: var(--pk-fail); stroke-width: 3.2; stroke-linecap: round; fill: none; }
.sc-node.is-new > .body, .sc-node.is-new > .label { animation: sc-pop .5s cubic-bezier(.2, 1.5, .4, 1) both; transform-box: fill-box; transform-origin: center; }
.scene-svg .label rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.scene-svg .label text { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.scene-svg .link-label rect { fill: var(--surface); stroke: var(--blue-line); stroke-width: 1; }
.scene-svg .link-label text { font: 500 11px var(--f-mono); fill: var(--muted); }
.scene-svg .note, .scene-svg .zone text { paint-order: stroke; stroke: var(--plan-bg); stroke-width: 3.5px; stroke-linejoin: round; }
.scene-svg .note { font: 400 10.5px var(--f-mono); fill: var(--muted); }
.scene-svg .items rect { fill: var(--blue-soft); stroke: var(--blue-line); stroke-width: 1; }
.scene-svg .items text { font: 500 10px var(--f-mono); fill: var(--ink); }
.scene-svg .nbadge > rect:first-child { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
.scene-svg .nbadge text { font: 600 11px var(--f-mono); fill: var(--ink); }
.scene-svg .bar-bg { fill: var(--line); }
.scene-svg .bar.good { fill: var(--green); }
.scene-svg .bar.mid { fill: var(--amber); }
.scene-svg .bar.bad { fill: var(--pk-fail); }
.scene-svg .sc-link { fill: none; stroke: var(--ink); stroke-opacity: .5; stroke-width: 2; stroke-linecap: round; }
.scene-svg .sc-link.dashed { stroke-dasharray: 5 5; }
.scene-svg .sc-link.s-hot { stroke: var(--pk-fail); stroke-opacity: .8; }
.scene-svg .sc-link.s-down { stroke: var(--pk-fail); stroke-opacity: .7; stroke-dasharray: 3 6; }
.scene-svg .sc-link.s-dim { stroke-opacity: .16; }
.scene-svg .arrow-head { fill: var(--ink); fill-opacity: .6; }
.scene-svg .zone rect { fill: color-mix(in srgb, var(--blue) 5%, transparent); stroke: var(--blue-line); stroke-width: 1.4; stroke-dasharray: 7 5; }
.scene-svg .zone text { font: 600 11px var(--f-mono); letter-spacing: .02em; fill: var(--muted); }
.scene-svg .zone.z-good rect { stroke: var(--green); fill: color-mix(in srgb, var(--green) 6%, transparent); }
.scene-svg .zone.z-bad rect { stroke: var(--pk-fail); fill: color-mix(in srgb, var(--pk-fail) 5%, transparent); }
.scene-svg .zone.z-warn rect { stroke: var(--amber); fill: color-mix(in srgb, var(--amber) 6%, transparent); }
.scene-svg .ring .track { fill: none; stroke: var(--blue-line); stroke-width: 9; stroke-opacity: .45; }
.scene-svg .ring .tick { stroke: var(--ink); stroke-width: 1; }
.scene-svg .pk circle, .scene-svg .pk rect, .scene-svg .pk path { stroke: var(--surface); stroke-width: 1.8; }
.scene-svg .pk.k-req > * { fill: var(--pk-req); }
.scene-svg .pk.k-resp > * { fill: var(--pk-resp); }
.scene-svg .pk.k-write > * { fill: var(--pk-write); }
.scene-svg .pk.k-event > * { fill: var(--pk-event); }
.scene-svg .pk.k-heavy > * { fill: var(--pk-heavy); }
.scene-svg .pk.k-fail > * { fill: var(--pk-fail); }
.scene-svg .pk.k-ping > * { fill: var(--surface); stroke: var(--pk-write); stroke-width: 2.4; }
.scene-svg .burst { animation: sc-burst .65s ease-out both; transform-box: fill-box; transform-origin: center; }
.scene-svg .burst circle { fill: none; stroke-width: 2.4; }
.scene-svg .burst.bad circle, .scene-svg .burst.bad path { stroke: var(--pk-fail); stroke-width: 2.4; stroke-linecap: round; }
.scene-svg .burst.good circle { stroke: var(--green); }
@keyframes sc-pop { from { transform: scale(.55); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sc-pulse { 0%, 100% { opacity: .1; } 50% { opacity: .26; } }
@keyframes sc-burst { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.7); } }
@media (min-width: 640px) {
  .sc-stage { margin: 0; border: 1px solid var(--line); border-radius: 12px; }
  .sc-metrics, .sc-steps { margin: 0; padding-inline: 0; }
  .scene-svg { max-width: 600px; }
}

/* Predict before seeing, and mini plans inside questions */
.sc-predict { display: flex; flex-direction: column; gap: 8px; border: 1.5px solid var(--blue-line); background: var(--surface-2); border-radius: 12px; padding: 12px; }
.sc-predict .mono-label { color: var(--blue); }
.sc-predict .q { font-weight: 600; line-height: 1.45; }
.mini-stage { margin: 8px 0 10px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; }
.mini-stage .scene-svg { max-height: 300px; }
.flash .mini-stage { margin: 0; }

/* The lesson is the scene: «Saber más», a sticky step bar and the folded extras */
.sc-more { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.sc-more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 13px; cursor: pointer; font-weight: 600; color: var(--blue); }
.sc-more > summary::-webkit-details-marker { display: none; }
.sc-more > summary svg { width: 16px; height: 16px; transition: transform .15s ease; transform: rotate(90deg); }
.sc-more[open] > summary svg { transform: rotate(-90deg); }
.sc-more > .prose { padding: 0 13px 13px; font-size: .95rem; }
.sc-nav { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin: 2px -10px 0; padding: 8px 10px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 -1px 0 var(--line), 0 6px 18px rgba(0, 0, 0, .08); }
.more-card { padding: 6px 20px; }
.more-item { border-top: 1px solid var(--line); }
.more-item:first-child { border-top: 0; }
.more-item > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0; cursor: pointer; font-weight: 600; }
.more-item > summary::-webkit-details-marker { display: none; }
.more-item > summary small { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.more-item > summary svg { width: 16px; height: 16px; flex: none; transform: rotate(90deg); transition: transform .15s ease; color: var(--muted); }
.more-item[open] > summary svg { transform: rotate(-90deg); }
.more-item > :not(summary) { margin-bottom: 14px; }
.more-card .used { padding: 12px 0 14px; border-top: 1px solid var(--line); font-size: .9rem; }

/* Segmented choice (cards per review session) */
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 8px; }
.seg button { border: 0; background: var(--surface); padding: 8px 18px; font: 600 .95rem var(--f-mono); cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }

/* Review levels: what you already know gets harder */
.lvl { color: var(--muted); letter-spacing: .06em; }
.lvl-1 { color: var(--amber); }
.lvl-2 { color: var(--pencil); }
.flash-def { border-left: 3px solid var(--blue-line); padding-left: 12px; }
.flash textarea { width: 100%; min-height: 78px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 400 1rem/1.45 var(--f-body); color: var(--ink); background: var(--surface-2); resize: vertical; }
.flash textarea:focus { outline: none; border-color: var(--blue); }
.rev-typed { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.rev-typed p { margin-top: 4px; white-space: pre-wrap; }
.rev-claude { align-self: flex-start; font-size: .95rem; }
</style>
